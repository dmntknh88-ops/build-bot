# .github/workflows/flutter-analyze.yml
# Flutter Analyze Only - Error Detection

name: Flutter Analyze

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build untuk identifikasi"
        required: true
        default: "analyze-latest"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download ZIP project
        run: |
          echo "📥 Downloading project ZIP..."
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            --connect-timeout 30 \
            --max-time 120

          echo "📦 File size: $(du -h project.zip | cut -f1)"

      - name: Extract ZIP
        run: |
          echo "📂 Extracting ZIP..."
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ Invalid ZIP file!"
            exit 1
          fi

          unzip -q project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project extracted to: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Run Flutter Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "🔍 Running Flutter Analyze..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ ERROR: pubspec.yaml not found!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "STATUS=FAILED" >> $GITHUB_ENV
            exit 1
          fi

          flutter analyze 2>&1 | tee analyze_result.txt || true
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Parse Analyze Results
        id: parse_results
        run: |
          echo "📊 Parsing analyze results..."
          
          if [ -f "${{ env.PROJECT_DIR }}/analyze_result.txt" ]; then
            cat "${{ env.PROJECT_DIR }}/analyze_result.txt"
          fi
          
          ERROR_COUNT=$(grep -c "error" "${{ env.PROJECT_DIR }}/analyze_result.txt" 2>/dev/null || echo "0")
          WARNING_COUNT=$(grep -c "warning" "${{ env.PROJECT_DIR }}/analyze_result.txt" 2>/dev/null || echo "0")
          INFO_COUNT=$(grep -c "info" "${{ env.PROJECT_DIR }}/analyze_result.txt" 2>/dev/null || echo "0")
          
          echo "ERROR_COUNT=$ERROR_COUNT" >> $GITHUB_ENV
          echo "WARNING_COUNT=$WARNING_COUNT" >> $GITHUB_ENV
          echo "INFO_COUNT=$INFO_COUNT" >> $GITHUB_ENV
          
          echo "📊 Summary:"
          echo "  ❌ Errors: $ERROR_COUNT"
          echo "  ⚠️ Warnings: $WARNING_COUNT"
          echo "  ℹ️ Infos: $INFO_COUNT"

      - name: Check for Errors
        id: check_errors
        run: |
          if [ "${{ env.ERROR_COUNT }}" -gt 0 ]; then
            echo "❌ Found ${{ env.ERROR_COUNT }} error(s)!"
            echo "STATUS=FAILED" >> $GITHUB_ENV
            exit 1
          else
            echo "✅ No errors found!"
            echo "STATUS=PASSED" >> $GITHUB_ENV
          fi

      - name: Generate Report
        id: generate_report
        if: always()
        run: |
          echo "📝 Generating analyze report..."
          
          REPORT_FILE="analyze_report_${{ github.event.inputs.tag }}.txt"
          
          echo "═══════════════════════════════════════════════════════════════" > $REPORT_FILE
          echo "📊 FLUTTER ANALYZE REPORT" >> $REPORT_FILE
          echo "═══════════════════════════════════════════════════════════════" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "📌 Tag: ${{ github.event.inputs.tag }}" >> $REPORT_FILE
          echo "🕐 Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "📈 SUMMARY:" >> $REPORT_FILE
          echo "  ❌ Errors: ${{ env.ERROR_COUNT }}" >> $REPORT_FILE
          echo "  ⚠️ Warnings: ${{ env.WARNING_COUNT }}" >> $REPORT_FILE
          echo "  ℹ️ Infos: ${{ env.INFO_COUNT }}" >> $REPORT_FILE
          echo "  📊 Status: ${{ env.STATUS }}" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $REPORT_FILE
          echo "" >> $REPORT_FILE
          
          if [ -f "${{ env.PROJECT_DIR }}/analyze_result.txt" ]; then
            echo "📄 DETAILED OUTPUT:" >> $REPORT_FILE
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" >> $REPORT_FILE
            cat "${{ env.PROJECT_DIR }}/analyze_result.txt" >> $REPORT_FILE
          else
            echo "⚠️ No analyze result file found" >> $REPORT_FILE
          fi
          
          echo "REPORT_FILE=$REPORT_FILE" >> $GITHUB_ENV

      - name: Upload Analyze Report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-report-${{ github.event.inputs.tag }}
          path: ${{ env.REPORT_FILE }}
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Full Log (if errors found)
        if: env.STATUS == 'FAILED'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-error-log-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/analyze_result.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -rf project_raw project.zip || true
          echo "🧹 Cleanup done"

      - name: Final Status
        if: always()
        run: |
          if [ "${{ env.STATUS }}" = "PASSED" ]; then
            echo "✅ ✅ ✅ ANALYZE PASSED - No errors found!"
          else
            echo "❌ ❌ ❌ ANALYZE FAILED - Please fix errors above!"
          fi
