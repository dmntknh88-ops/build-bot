name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: |
          echo "=== Verifying Flutter ==="
          flutter --version
          flutter doctor -v

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 3 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 180 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"

          echo ""
          echo "File size: $(ls -lh project.zip | awk '{print $5}')"
          echo "File type: $(file project.zip | cut -d: -f2-)"
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: Gagal download ZIP!"
            exit 1
          fi
          echo "✅ Download selesai"

      - name: Validate & Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          
          MAGIC=$(xxd -l 4 -p project.zip 2>/dev/null || echo "00000000")
          echo "Magic bytes: $MAGIC"
          
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ] && [ "$MAGIC" != "504b0708" ]; then
            echo "❌ ERROR: Bukan file ZIP valid!"
            exit 1
          fi
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ERROR: ZIP corrupt!"
            unzip -t project.zip 2>&1 || true
            exit 1
          fi
          echo "✅ ZIP valid"
          
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Gagal ekstrak ZIP!"
            exit 1
          fi
          echo "✅ Ekstraksi selesai"
          
          echo "=== Menentukan project directory ==="
          
          if [ -f "project_raw/pubspec.yaml" ]; then
            PROJECT_DIR="project_raw"
          else
            PUBSPEC_PATH=$(find project_raw -name "pubspec.yaml" | head -1)
            if [ -n "$PUBSPEC_PATH" ]; then
              PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            else
              echo "❌ ERROR: pubspec.yaml tidak ditemukan!"
              exit 1
            fi
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Flutter Analyze ==="
          flutter analyze 2>&1 | tee analyze_report.txt || true
          echo ""
          echo "Analyze Result:"
          cat analyze_report.txt

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Getting dependencies ==="
          flutter pub get
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: flutter pub get gagal!"
            exit 1
          fi
          echo "✅ Dependencies installed"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
          flutter build apk --${{ github.event.inputs.build_type }}
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Flutter build gagal!"
            exit 1
          fi
          echo "✅ Build selesai"

      - name: Find APK
        run: |
          echo "=== Mencari APK ==="
          
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FOUND" ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan!"
            exit 1
          fi
          
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_ENV
          echo "✅ APK ditemukan: $APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error