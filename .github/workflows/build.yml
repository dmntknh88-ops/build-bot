name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.6"
          channel: "stable"

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 60 \
            --max-time 300 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n=== Size: %{size_download} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip
          file project.zip

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            unzip -t project.zip 2>&1 || true
            exit 1
          fi
          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Menentukan Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"

          echo ""
          echo "=== Isi Project ==="
          ls -la "$PROJECT_DIR" | head -30

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== Flutter Analyze ==="
            flutter analyze 2>&1 | tee analyze_report.txt || true
            cat analyze_report.txt
            rm -f analyze_report.txt
          else
            echo "ℹ️ Bukan Flutter project, skip analyze"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "📦 Getting Flutter dependencies..."
            flutter pub get
          else
            echo "ℹ️ Bukan Flutter project, skip pub get"
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILD APK ==="
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
          if [ -f "pubspec.yaml" ]; then
            echo "✅ Flutter project detected"
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            echo "✅ Native Android project detected"
            
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: gradlew tidak ditemukan!"
              echo ""
              echo "📂 Isi direktori:"
              ls -la
              exit 1
            fi
            
            echo "✅ gradlew found: $GRADLE_PATH"
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Find APK
        run: |
          echo "=== Mencari APK ==="
          
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f)
          APK_COUNT=$(echo "$APK_FOUND" | grep -c "." || echo "0")
          
          echo "📊 Total APK: $APK_COUNT"
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan!"
            echo ""
            echo "📂 Mencari di seluruh workspace..."
            find $GITHUB_WORKSPACE -type f | head -50
            exit 1
          fi
          
          APK_PATH=$(echo "$APK_FOUND" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -rf project_raw project.zip || true
          echo "🧹 Cleanup selesai"