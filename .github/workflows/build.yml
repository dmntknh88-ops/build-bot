name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 5 \
            --retry-delay 4 \
            --connect-timeout 45 \
            --max-time 240 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip || true
          file project.zip || true
          xxd project.zip | head -2 || true

          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: File ZIP kosong atau gagal didownload!"
            exit 1
          fi

      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            head -c 300 project.zip || true
            exit 1
          fi
          echo "✅ ZIP valid"

          rm -rf project_raw
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then
            echo "❌ Gagal extract ZIP!"
            exit 1
          fi

          echo "=== Menentukan Project Dir ==="
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            FOUND=$(find project_raw -name "pubspec.yaml" -type f | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"
          ls -la "$PROJECT_DIR" | head -15 || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get || true
            flutter analyze > analyze_report.txt 2>&1 || true
            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt || true
            echo "[END_RESULT_ANALYZE]"
            rm -f analyze_report.txt
          else
            echo "[RESULT_ANALYZE]"
            echo "❌ pubspec.yaml tidak ditemukan."
            echo "[END_RESULT_ANALYZE]"
          fi

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Mode only_analyze aktif → berhenti"
          exit 1

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== Running flutter pub get ==="
            timeout 180s flutter pub get || {
              echo "⚠️ pub get gagal, mencoba cache repair..."
              flutter pub cache repair || true
              timeout 180s flutter pub get || echo "⚠️ Lanjut ke tahap berikutnya..."
            }
          else
            echo "⚠️ Bukan project Flutter, skip pub get"
          fi

      - name: Auto Fix Flutter Issues
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== 🔧 Auto Fix Flutter Issues ==="
          
          if [ ! -f "pubspec.yaml" ]; then
            echo "Bukan project Flutter → skip"
            exit 0
          fi

          mkdir -p android/app/src/main

          # 1. local.properties
          if [ ! -f "android/local.properties" ]; then
            echo "→ Membuat android/local.properties"
            echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi

          # 2. Fix build.gradle (app level)
          if [ -f "android/app/build.gradle" ]; then
            echo "→ Memperbaiki android/app/build.gradle"

            # minSdkVersion minimal 21
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk [0-9]\+/minSdk 21/g' android/app/build.gradle || true

            # compileSdk & targetSdk
            sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 34/g' android/app/build.gradle || true
            sed -i 's/compileSdk [0-9]\+/compileSdk 34/g' android/app/build.gradle || true
            sed -i 's/targetSdk [0-9]\+/targetSdk 34/g' android/app/build.gradle || true

            # multiDexEnabled
            if ! grep -q "multiDexEnabled" android/app/build.gradle; then
              sed -i '/defaultConfig {/a\        multiDexEnabled true' android/app/build.gradle || true
              echo "  + multiDexEnabled true"
            fi

            # namespace (untuk AGP 8+)
            if ! grep -q "namespace" android/app/build.gradle; then
              PACKAGE=$(grep -oP 'package="\K[^"]+' android/app/src/main/AndroidManifest.xml 2>/dev/null | head -1 || echo "com.example.app")
              sed -i "/android {/a\    namespace \"$PACKAGE\"" android/app/build.gradle || true
              echo "  + namespace: $PACKAGE"
            fi
          fi

          # 3. Fix AndroidManifest.xml (android:exported)
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "→ Memperbaiki AndroidManifest.xml"
            # Tambahkan android:exported="true" pada activity yang belum punya
            sed -i 's/<activity\([^>]*\)>/<activity\1 android:exported="true">/g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true
            # Hindari duplikat
            sed -i 's/android:exported="true" android:exported="true"/android:exported="true"/g' android/app/src/main/AndroidManifest.xml || true
          fi

          # 4. Pastikan settings.gradle & gradle wrapper ada
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "→ Membuat settings.gradle dasar"
            cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF
          fi

          echo "✅ Auto Fix selesai"

      - name: Build APK (dengan Retry + Auto Fix)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "=== 🏗️ Building Flutter APK ==="
            
            BUILD_CMD="flutter build apk --${{ github.event.inputs.build_type }}"
            
            # Percobaan 1
            if $BUILD_CMD; then
              echo "✅ Build berhasil (percobaan 1)"
            else
              echo "⚠️ Build gagal → menjalankan Clean + Fix tambahan + Retry..."
              
              flutter clean || true
              flutter pub get || true
              
              # Fix tambahan saat retry
              if [ -f "android/app/build.gradle" ]; then
                sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 34/g' android/app/build.gradle || true
                sed -i 's/targetSdkVersion [0-9]\+/targetSdkVersion 34/g' android/app/build.gradle || true
                sed -i 's/compileSdk [0-9]\+/compileSdk 34/g' android/app/build.gradle || true
                sed -i 's/targetSdk [0-9]\+/targetSdk 34/g' android/app/build.gradle || true
                sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' android/app/build.gradle || true
              fi
              
              # Pastikan local.properties
              mkdir -p android
              echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
              echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
              
              echo "=== 🔄 Retry Build ==="
              $BUILD_CMD
            fi
          else
            echo "=== Mencoba build Native (Gradle) ==="
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ Tidak ditemukan pubspec.yaml maupun gradlew!"
              exit 1
            fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug --stacktrace
            else
              ./gradlew assembleRelease --stacktrace
            fi
          fi

      - name: Check APK Output
        run: |
          echo "=== Mencari file APK ==="
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ Tidak ada file APK yang ditemukan!"
            find $GITHUB_WORKSPACE \( -name "*.apk" -o -name "pubspec.yaml" -o -name "gradlew" \) | head -20 || true
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK ditemukan: $APK_FOUND"
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          retention-days: 2
          if-no-files-found: error