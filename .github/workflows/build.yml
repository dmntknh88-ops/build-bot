name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - true
          - false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Debug Environment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐛 DEBUG ENVIRONMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "URL: ${{ github.event.inputs.zip_url }}"
          echo "Tag: ${{ github.event.inputs.tag }}"
          echo "Build Type: ${{ github.event.inputs.build_type }}"

      - name: Download ZIP project
        id: download
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 DOWNLOADING PROJECT ZIP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          echo "URL: $ZIP_URL"
          
          if [ -z "$ZIP_URL" ]; then
            echo "❌ ERROR: ZIP URL kosong!"
            exit 1
          fi
          
          if [[ ! "$ZIP_URL" =~ ^https?:// ]]; then
            echo "❌ ERROR: URL tidak valid!"
            exit 1
          fi
          
          TOKEN="${{ secrets.GH_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            curl -L -H "Authorization: Bearer $TOKEN" -H "Accept: application/octet-stream" --fail --retry 5 --retry-delay 5 --connect-timeout 60 --max-time 300 -o project.zip "$ZIP_URL" -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"
          else
            curl -L -H "Accept: application/octet-stream" --fail --retry 5 --retry-delay 5 --connect-timeout 60 --max-time 300 -o project.zip "$ZIP_URL" -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"
          fi
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: Gagal download ZIP!"
            exit 1
          fi
          
          echo "✅ Download selesai! Size: $(ls -lh project.zip | awk '{print $5}')"

      - name: Validate & Extract ZIP
        id: extract
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📂 VALIDATING & EXTRACTING ZIP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          MAGIC=$(xxd -l 4 -p project.zip 2>/dev/null || echo "00000000")
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ] && [ "$MAGIC" != "504b0708" ]; then
            echo "❌ ERROR: Bukan file ZIP valid!"
            exit 1
          fi
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ERROR: ZIP corrupt!"
            exit 1
          fi
          
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then echo "❌ ERROR: Gagal ekstrak ZIP!"; exit 1; fi
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          SUB_FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$SUB_FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project directory: $PROJECT_DIR"
          
          if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml ditemukan!"
            echo "IS_FLUTTER=true" >> $GITHUB_ENV
          else
            echo "IS_FLUTTER=false" >> $GITHUB_ENV
            if [ -f "$PROJECT_DIR/build.gradle" ] || [ -f "$PROJECT_DIR/app/build.gradle" ]; then
              echo "✅ build.gradle ditemukan! (Native Android)"
              echo "IS_NATIVE=true" >> $GITHUB_ENV
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        if: env.IS_FLUTTER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze 2>&1 | tee analyze_report.txt || true
          echo "📊 ANALYZE RESULT:"
          cat analyze_report.txt

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 1

      - name: Get Dependencies
        if: env.IS_FLUTTER == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "pubspec.yaml" ]; then exit 1; fi
          flutter pub get || exit 1

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --${{ github.event.inputs.build_type }}
          else
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -z "$GRADLE_PATH" ]; then echo "❌ ERROR: gradlew tidak ditemukan!"; exit 1; fi
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR" && chmod +x gradlew
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "❌ ERROR: APK tidak ditemukan!"; exit 1; fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK found: $APK_PATH ($(ls -lh "$APK_PATH" | awk '{print $5}'))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf project_raw project.zip || true