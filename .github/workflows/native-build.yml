name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android Native"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 60 \
            --max-time 300 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"

          echo ""
          echo "File size: $(ls -lh project.zip | awk '{print $5}')"
          echo "File type: $(file project.zip | cut -d: -f2-)"
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: Gagal download ZIP!"
            exit 1
          fi
          echo "✅ Download selesai"

      - name: Validate & Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          
          MAGIC=$(xxd -l 4 -p project.zip 2>/dev/null || echo "00000000")
          echo "Magic bytes: $MAGIC"
          
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ] && [ "$MAGIC" != "504b0708" ]; then
            echo "❌ ERROR: Bukan file ZIP valid!"
            exit 1
          fi
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ERROR: ZIP corrupt!"
            unzip -t project.zip 2>&1 || true
            exit 1
          fi
          echo "✅ ZIP valid"
          
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Gagal ekstrak ZIP!"
            exit 1
          fi
          echo "✅ Ekstraksi selesai"
          
          echo "=== Menentukan project directory ==="
          
          if [ -f "project_raw/build.gradle" ] || [ -f "project_raw/app/build.gradle" ]; then
            PROJECT_DIR="project_raw"
            echo "✅ build.gradle di root"
          elif [ -f "project_raw/*/build.gradle" ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 2 -name "build.gradle" -printf "%h\n" | head -1)
            echo "✅ build.gradle ditemukan di: $PROJECT_DIR"
          else
            GRADLE_PATH=$(find project_raw -name "build.gradle" | head -1)
            if [ -n "$GRADLE_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_PATH")
              echo "✅ build.gradle ditemukan di: $PROJECT_DIR"
            else
              echo "❌ ERROR: build.gradle tidak ditemukan!"
              exit 1
            fi
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"
          
          echo ""
          echo "📂 Isi project:"
          ls -la "$PROJECT_DIR" | head -30

      - name: Fix Missing Mipmap Resources (Universal)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Fix Missing Mipmap Resources (Universal) ==="
          
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          
          # Cari folder res
          RES_DIR=""
          if [ -d "app/src/main/res" ]; then
            RES_DIR="app/src/main/res"
          else
            RES_DIR=$(find . -type d -path "*/src/main/res" | head -1)
          fi
          
          if [ -z "$RES_DIR" ] || [ ! -d "$RES_DIR" ]; then
            echo "❌ ERROR: Folder res tidak ditemukan!"
            exit 1
          fi
          
          echo "RES_DIR = $RES_DIR"
          
          # Buat semua density folder
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
          done
          
          # Fungsi generate icon
          create_icon() {
            local name=$1
            local color=${2:-"#3DDC84"}
            
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi)    size=48  ;;
                hdpi)    size=72  ;;
                xhdpi)   size=96  ;;
                xxhdpi)  size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              
              # Skip kalau sudah ada
              if [ -f "$RES_DIR/mipmap-$density/${name}.png" ]; then
                continue
              fi
              
              convert -size ${size}x${size} xc:"$color" \
                -fill white -gravity center -pointsize $((size/4)) \
                -annotate +0+0 "APP" \
                "$RES_DIR/mipmap-$density/${name}.png"
            done
            echo "  → Created: $name"
          }
          
          echo ""
          echo "🔍 Mencari semua referensi @mipmap di AndroidManifest..."
          
          # Cari AndroidManifest.xml
          MANIFEST=$(find . -name "AndroidManifest.xml" | head -1)
          
          if [ -z "$MANIFEST" ]; then
            echo "⚠️ AndroidManifest.xml tidak ditemukan, membuat icon default saja"
            create_icon "ic_launcher" "#3DDC84"
            create_icon "ic_launcher_round" "#3DDC84"
          else
            echo "Manifest: $MANIFEST"
            
            # Ambil semua nama resource mipmap yang direferensikan
            # Contoh: @mipmap/ic_launcher → ic_launcher
            MISSING_ICONS=$(grep -oE '@mipmap/[a-zA-Z0-9_]+' "$MANIFEST" | sed 's/@mipmap\///' | sort -u)
            
            if [ -z "$MISSING_ICONS" ]; then
              echo "Tidak ada referensi @mipmap ditemukan"
            else
              echo "Ditemukan referensi mipmap:"
              echo "$MISSING_ICONS"
              echo ""
              
              for icon in $MISSING_ICONS; do
                # Cek apakah file benar-benar sudah ada di salah satu density
                EXISTS=false
                for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                  if [ -f "$RES_DIR/mipmap-$density/${icon}.png" ] || [ -f "$RES_DIR/mipmap-$density/${icon}.webp" ]; then
                    EXISTS=true
                    break
                  fi
                done
                
                if [ "$EXISTS" = false ]; then
                  # Warna berbeda biar gampang bedain
                  case $icon in
                    *whatsapp*)   color="#25D366" ;;
                    *youtube*)    color="#FF0000" ;;
                    *instagram*)  color="#E1306C" ;;
                    *telegram*)   color="#0088CC" ;;
                    *xnxx*|*xxx*) color="#111111" ;;
                    *round*)      color="#3DDC84" ;;
                    *)            color="#3DDC84" ;;
                  esac
                  
                  create_icon "$icon" "$color"
                else
                  echo "  ✓ Sudah ada: $icon"
                fi
              done
            fi
          fi
          
          # Pastikan minimal launcher icon selalu ada
          create_icon "ic_launcher" "#3DDC84"
          create_icon "ic_launcher_round" "#3DDC84"
          
          echo ""
          echo "=== Ringkasan icon yang ada ==="
          find "$RES_DIR"/mipmap-* -name "*.png" -o -name "*.webp" | sort
          echo ""
          echo "✅ Fix mipmap selesai (universal)"

      - name: Fix Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Fixing Gradle Wrapper ==="
          
          if [ -f "gradlew" ]; then
            echo "✅ gradlew ditemukan"
            chmod +x gradlew
            
            if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "⚠️ gradle-wrapper.jar tidak ditemukan! Mendownload..."
              mkdir -p gradle/wrapper
              curl -L -o gradle/wrapper/gradle-wrapper.jar \
                "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
              echo "✅ gradle-wrapper.jar berhasil didownload"
            else
              echo "✅ gradle-wrapper.jar ditemukan"
            fi
          else
            echo "⚠️ gradlew tidak ditemukan! Membuat gradle wrapper..."
            sudo apt-get update -qq
            sudo apt-get install -y wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip
            export PATH=$PWD/gradle-8.4/bin:$PATH
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            echo "✅ Gradle wrapper berhasil dibuat"
          fi

      - name: Build Native Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building Native Android APK ==="
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
          chmod +x gradlew 2>/dev/null || true
          
          if [ ! -f "gradlew" ]; then
            echo "❌ ERROR: gradlew tidak ditemukan!"
            exit 1
          fi
          
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar tidak ditemukan, membuat ulang..."
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "🏗️ Running ./gradlew assembleDebug..."
            ./gradlew assembleDebug --stacktrace
          else
            echo "🏗️ Running ./gradlew assembleRelease..."
            ./gradlew assembleRelease --stacktrace
          fi
          
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Build gagal!"
            exit 1
          fi
          echo "✅ Build selesai"

      - name: Find APK
        run: |
          echo "=== Mencari APK ==="
          
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f)
          APK_COUNT=$(echo "$APK_FOUND" | grep -c "." || echo "0")
          
          echo "📊 Total APK found: $APK_COUNT"
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan!"
            exit 1
          fi
          
          APK_PATH=$(echo "$APK_FOUND" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK found: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error