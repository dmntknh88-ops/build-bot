name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android Native"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 60 \
            --max-time 300 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"

          echo ""
          echo "File size: $(ls -lh project.zip | awk '{print $5}')"
          echo "File type: $(file project.zip | cut -d: -f2-)"
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: Gagal download ZIP!"
            exit 1
          fi
          echo "✅ Download selesai"

      - name: Validate & Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          
          MAGIC=$(xxd -l 4 -p project.zip 2>/dev/null || echo "00000000")
          echo "Magic bytes: $MAGIC"
          
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ] && [ "$MAGIC" != "504b0708" ]; then
            echo "❌ ERROR: Bukan file ZIP valid!"
            exit 1
          fi
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ERROR: ZIP corrupt!"
            unzip -t project.zip 2>&1 || true
            exit 1
          fi
          echo "✅ ZIP valid"
          
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Gagal ekstrak ZIP!"
            exit 1
          fi
          echo "✅ Ekstraksi selesai"
          
          echo "=== Menentukan project directory ==="
          
          if [ -f "project_raw/build.gradle" ] || [ -f "project_raw/app/build.gradle" ]; then
            PROJECT_DIR="project_raw"
          else
            GRADLE_PATH=$(find project_raw -name "build.gradle" | head -1)
            if [ -n "$GRADLE_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_PATH")
            else
              echo "❌ ERROR: build.gradle tidak ditemukan!"
              exit 1
            fi
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"

      - name: Build Native Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building Native Android APK ==="
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLE_PATH" ]; then
            echo "ℹ️ gradlew tidak ditemukan, menggunakan gradle global"
            GRADLE_CMD="gradle"
          else
            echo "✅ gradlew found: $GRADLE_PATH"
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          fi
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "🏗️ Running $GRADLE_CMD assembleDebug..."
            $GRADLE_CMD assembleDebug
          else
            echo "🏗️ Running $GRADLE_CMD assembleRelease..."
            $GRADLE_CMD assembleRelease
          fi
          
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Build gagal!"
            exit 1
          fi
          echo "✅ Build selesai"

      - name: Find APK
        run: |
          echo "=== Mencari APK ==="
          
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FOUND" ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan!"
            exit 1
          fi
          
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_ENV
          echo "✅ APK ditemukan: $APK_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error