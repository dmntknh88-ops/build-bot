name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Android Native"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 60 \
            --max-time 300 \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\nHTTP Status: %{http_code}\nSize: %{size_download}\n"

          echo ""
          echo "File size: $(ls -lh project.zip | awk '{print $5}')"
          echo "File type: $(file project.zip | cut -d: -f2-)"
          
          if [ ! -f "project.zip" ] || [ ! -s "project.zip" ]; then
            echo "❌ ERROR: Gagal download ZIP!"
            exit 1
          fi
          echo "✅ Download selesai"

      - name: Validate & Extract ZIP
        run: |
          echo "=== Validating ZIP ==="
          
          MAGIC=$(xxd -l 4 -p project.zip 2>/dev/null || echo "00000000")
          echo "Magic bytes: $MAGIC"
          
          if [ "$MAGIC" != "504b0304" ] && [ "$MAGIC" != "504b0506" ] && [ "$MAGIC" != "504b0708" ]; then
            echo "❌ ERROR: Bukan file ZIP valid!"
            exit 1
          fi
          
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ ERROR: ZIP corrupt!"
            unzip -t project.zip 2>&1 || true
            exit 1
          fi
          echo "✅ ZIP valid"
          
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Gagal ekstrak ZIP!"
            exit 1
          fi
          echo "✅ Ekstraksi selesai"
          
          echo "=== Menentukan project directory ==="
          
          if [ -f "project_raw/build.gradle" ] || [ -f "project_raw/app/build.gradle" ]; then
            PROJECT_DIR="project_raw"
            echo "✅ build.gradle di root"
          elif [ -f "project_raw/*/build.gradle" ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 2 -name "build.gradle" -printf "%h\n" | head -1)
            echo "✅ build.gradle ditemukan di: $PROJECT_DIR"
          else
            GRADLE_PATH=$(find project_raw -name "build.gradle" | head -1)
            if [ -n "$GRADLE_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLE_PATH")
              echo "✅ build.gradle ditemukan di: $PROJECT_DIR"
            else
              echo "❌ ERROR: build.gradle tidak ditemukan!"
              exit 1
            fi
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project Dir: $PROJECT_DIR"
          
          echo ""
          echo "📂 Isi project:"
          ls -la "$PROJECT_DIR" | head -30

      - name: Fix Mipmap Icons (Dinamis sesuai file di ZIP)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Fix Mipmap Icons (Dinamis) ==="
          
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          
          # Cari folder res
          RES_DIR=""
          if [ -d "app/src/main/res" ]; then
            RES_DIR="app/src/main/res"
          else
            RES_DIR=$(find . -type d -path "*/src/main/res" | head -1)
          fi
          
          if [ -z "$RES_DIR" ] || [ ! -d "$RES_DIR" ]; then
            echo "❌ ERROR: Folder res tidak ditemukan!"
            exit 1
          fi
          
          echo "RES_DIR = $RES_DIR"
          
          # Buat density
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
          done
          
          # Fungsi convert
          convert_to_mipmap() {
            local src="$1"
            local name="$2"
            
            echo "  → $src  ==>  $name"
            
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              case $density in
                mdpi)    size=48  ;;
                hdpi)    size=72  ;;
                xhdpi)   size=96  ;;
                xxhdpi)  size=144 ;;
                xxxhdpi) size=192 ;;
              esac
              
              convert "$src" \
                -resize ${size}x${size}^ \
                -gravity center \
                -extent ${size}x${size} \
                -background none \
                "$RES_DIR/mipmap-$density/${name}.png"
            done
          }
          
          echo ""
          echo "1. Mencari semua gambar di ZIP..."
          
          mapfile -t IMAGES < <(find . .. ../.. -maxdepth 4 -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) 2>/dev/null | sort -u)
          
          echo "Ditemukan ${#IMAGES[@]} gambar:"
          printf '   %s\n' "${IMAGES[@]}"
          
          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "❌ Tidak ada gambar sama sekali!"
            exit 1
          fi
          
          echo ""
          echo "2. Membaca icon yang dibutuhkan dari AndroidManifest..."
          
          MANIFEST=$(find . -name "AndroidManifest.xml" | head -1)
          NEEDED=()
          
          if [ -n "$MANIFEST" ]; then
            mapfile -t NEEDED < <(grep -oE '@mipmap/[a-zA-Z0-9_]+' "$MANIFEST" | sed 's/@mipmap\///' | sort -u)
          fi
          
          # Pastikan launcher selalu ada
          NEEDED+=("ic_launcher" "ic_launcher_round")
          mapfile -t NEEDED < <(printf '%s\n' "${NEEDED[@]}" | sort -u)
          
          echo "Icon yang dibutuhkan:"
          printf '   %s\n' "${NEEDED[@]}"
          
          echo ""
          echo "3. Mencocokkan gambar dengan icon..."
          
          # Cari gambar terbaik untuk launcher (prioritas nama yang mengandung sync / icon / logo / app)
          LAUNCHER_SRC=""
          for img in "${IMAGES[@]}"; do
            base=$(basename "$img" | tr '[:upper:]' '[:lower:]')
            if [[ "$base" == *sync* ]] || [[ "$base" == *icon* ]] || [[ "$base" == *logo* ]] || [[ "$base" == *app* ]]; then
              LAUNCHER_SRC="$img"
              break
            fi
          done
          
          # Kalau tidak ketemu, ambil gambar pertama
          if [ -z "$LAUNCHER_SRC" ]; then
            LAUNCHER_SRC="${IMAGES[0]}"
          fi
          
          echo "Gambar utama (launcher): $LAUNCHER_SRC"
          
          for icon in "${NEEDED[@]}"; do
            # Cek apakah sudah ada
            exists=false
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              if [ -f "$RES_DIR/mipmap-$d/${icon}.png" ] || [ -f "$RES_DIR/mipmap-$d/${icon}.webp" ]; then
                exists=true
                break
              fi
            done
            if [ "$exists" = true ]; then
              echo "  ✓ Sudah ada: $icon"
              continue
            fi
            
            MATCHED=""
            
            # Cocokkan berdasarkan kata kunci di nama file
            icon_lower=$(echo "$icon" | tr '[:upper:]' '[:lower:]')
            
            for img in "${IMAGES[@]}"; do
              base=$(basename "$img" | tr '[:upper:]' '[:lower:]')
              
              if [[ "$icon_lower" == *whatsapp* && "$base" == *whatsapp* ]]; then
                MATCHED="$img"; break
              elif [[ "$icon_lower" == *youtube* && "$base" == *youtube* ]]; then
                MATCHED="$img"; break
              elif [[ "$icon_lower" == *instagram* && "$base" == *instagram* ]]; then
                MATCHED="$img"; break
              elif [[ "$icon_lower" == *telegram* && "$base" == *telegram* ]]; then
                MATCHED="$img"; break
              elif [[ "$icon_lower" == *xnxx* || "$icon_lower" == *xxx* ]] && [[ "$base" == *xnxx* || "$base" == *xxx* ]]; then
                MATCHED="$img"; break
              fi
            done
            
            # Kalau tidak ketemu spesifik, pakai gambar utama
            if [ -z "$MATCHED" ]; then
              MATCHED="$LAUNCHER_SRC"
            fi
            
            convert_to_mipmap "$MATCHED" "$icon"
          done
          
          echo ""
          echo "=== Hasil akhir ==="
          find "$RES_DIR"/mipmap-* -name "*.png" | sort
          echo ""
          echo "✅ Selesai - icon sudah disesuaikan dengan file yang ada di masing-masing ZIP"

      - name: Fix Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Fixing Gradle Wrapper ==="
          
          if [ -f "gradlew" ]; then
            echo "✅ gradlew ditemukan"
            chmod +x gradlew
            
            if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "⚠️ gradle-wrapper.jar tidak ditemukan! Mendownload..."
              mkdir -p gradle/wrapper
              curl -L -o gradle/wrapper/gradle-wrapper.jar \
                "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
              echo "✅ gradle-wrapper.jar berhasil didownload"
            else
              echo "✅ gradle-wrapper.jar ditemukan"
            fi
          else
            echo "⚠️ gradlew tidak ditemukan! Membuat gradle wrapper..."
            sudo apt-get update -qq
            sudo apt-get install -y wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip
            export PATH=$PWD/gradle-8.4/bin:$PATH
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
            echo "✅ Gradle wrapper berhasil dibuat"
          fi

      - name: Build Native Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building Native Android APK ==="
          echo "Build type: ${{ github.event.inputs.build_type }}"
          
          chmod +x gradlew 2>/dev/null || true
          
          if [ ! -f "gradlew" ]; then
            echo "❌ ERROR: gradlew tidak ditemukan!"
            exit 1
          fi
          
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar tidak ditemukan, membuat ulang..."
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "🏗️ Running ./gradlew assembleDebug..."
            ./gradlew assembleDebug --stacktrace
          else
            echo "🏗️ Running ./gradlew assembleRelease..."
            ./gradlew assembleRelease --stacktrace
          fi
          
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Build gagal!"
            exit 1
          fi
          echo "✅ Build selesai"

      - name: Find APK
        run: |
          echo "=== Mencari APK ==="
          
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" -type f)
          APK_COUNT=$(echo "$APK_FOUND" | grep -c "." || echo "0")
          
          echo "📊 Total APK found: $APK_COUNT"
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ ERROR: Tidak ada APK ditemukan!"
            exit 1
          fi
          
          APK_PATH=$(echo "$APK_FOUND" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "✅ APK found: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error